[project]
name = "eures-beta-app"
version = "0.1.0"
description = "Dedicated API server for the EURES beta forms"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "gunicorn>=22.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.scripts]
serve = "app:app.run"
